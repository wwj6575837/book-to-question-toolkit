name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Compile
        run: |
          python -m compileall -q apply_keys.py bootstrap.py \
            .claude/skills/book-to-question/scripts 补题

      - name: Test
        run: python -m pytest -q
